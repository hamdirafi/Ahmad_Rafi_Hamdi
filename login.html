<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Face Scan</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-box">
            <h1 class="logo">AHMAD.RAFI.HAMDI</h1>
            <h2>Welcome Back</h2>
            <p class="subtitle">Silakan scan wajah Anda untuk login</p>

            <div class="camera-wrapper" id="cameraWrapper">
                <video id="video" autoplay playsinline></video>
                <div class="scanner-overlay" id="scannerOverlay">
                    <div class="scanner-line"></div>
                </div>
                <div class="face-frame"></div>
            </div>

            <p id="statusText" class="status-text">Memuat kamera...</p>
            <button id="startBtn" class="btn-scan" disabled>Mulai Scan Wajah</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
