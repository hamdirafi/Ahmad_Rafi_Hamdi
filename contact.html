<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <div class="logo"><a href="index.html">AHMAD.RAFI.HAMDI</a></div>
        <nav>
            <ul>
                <li><a href="work.html">Work</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="section page-content">
        <h1 class="page-title">Get In Touch</h1>
        <p class="page-desc">Punya proyek atau pertanyaan? Silakan hubungi saya!</p>
        
        <div class="contact-container">
            <div class="contact-info">
                <div class="contact-item">
                    <span class="contact-icon">📧</span>
                    <span>hello@alexdev.com</span>
                </div>
                <div class="contact-item">
                    <span class="contact-icon">📱</span>
                    <span>+62 812 3456 7890</span>
                </div>
                <div class="contact-item">
                    <span class="contact-icon">📍</span>
                    <span>Jakarta, Indonesia</span>
                </div>
            </div>
            
            <form class="contact-form" onsubmit="alert('Terima kasih! Pesan Anda telah terkirim.'); return false;">
                <input type="text" placeholder="Nama" required>
                <input type="email" placeholder="Email" required>
                <textarea placeholder="Pesan" rows="5" required></textarea>
                <button type="submit" class="btn-submit">Kirim Pesan</button>
            </form>
        </div>
    </section>

    <footer>
        <p>© 2023 Rafi Developer.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
